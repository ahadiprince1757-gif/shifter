<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:;
      worker-src 'self' blob:;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: blob: https://*.googleusercontent.com https://avatars.githubusercontent.com;
      connect-src 'self' *;
      manifest-src 'self';
    ">
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/tixar-logo.png?v=4" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tixar — Stop forgeting</title>
    <meta name="description" content="Tixar pinpoints where your memory breaks and fixes it ." />
    <!-- DNS prefetch & preconnect for external resources -->
    <link rel="dns-prefetch" href="https://shifter-i49i.onrender.com" />
    <link rel="preconnect" href="https://shifter-i49i.onrender.com" crossorigin />
    <link rel="dns-prefetch" href="https://tcppsnvvwxsmsoonaiyx.supabase.co" />
    <link rel="preconnect" href="https://tcppsnvvwxsmsoonaiyx.supabase.co" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload critical logo asset -->
    <link rel="preload" as="image" href="/tixar-logo.webp?v=4" type="image/webp" />
    <!-- Non-blocking font load: media=print trick avoids render-blocking -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@700;800;900&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@700;800;900&display=swap" rel="stylesheet" />
    </noscript>
    <link rel="manifest" href="/manifest.json" />


    <link rel="apple-touch-icon" href="/tixar-logo.png?v=4" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        // Automatically reload active page when new service worker takes control
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });

        window.addEventListener('load', () => {
          if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
            navigator.serviceWorker.getRegistrations().then((registrations) => {
              for (const registration of registrations) {
                registration.unregister();
              }
            });
          } else {
            navigator.serviceWorker.register('/sw.js?v=15.0').then((reg) => {
              reg.update();
            });
          }
        });
      }
    </script>
  </body>
</html>
