<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self' capacitor: https: http:;
      script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: capacitor:;
      worker-src 'self' blob:;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com data:;
      img-src 'self' data: blob: https: content: capacitor:;
      connect-src 'self' * blob: data: capacitor: https: http:;
      manifest-src 'self';
    ">
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/tixar-logo.png?v=4" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Tixar — Stop forgeting</title>
    <meta name="description" content="Tixar pinpoints where your memory breaks and fixes it ." />
    <!-- DNS prefetch & preconnect for external resources -->
    <link rel="dns-prefetch" href="https://shifter-i49i.onrender.com" />
    <link rel="preconnect" href="https://shifter-i49i.onrender.com" crossorigin />
    <link rel="dns-prefetch" href="https://tcppsnvvwxsmsoonaiyx.supabase.co" />
    <link rel="preconnect" href="https://tcppsnvvwxsmsoonaiyx.supabase.co" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload critical logo asset -->
    <link rel="preload" as="image" href="/tixar-logo.webp?v=4" type="image/webp" />
    <!-- Non-blocking font load: media=print trick avoids render-blocking -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@700;800;900&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@700;800;900&display=swap" rel="stylesheet" />
    </noscript>
    <link rel="manifest" href="/manifest.json" />


    <link rel="apple-touch-icon" href="/tixar-logo.png?v=4" />
    <script>
      // Startup error visualizer — prevents silent blank white screens on mobile webview
      window.addEventListener('error', function (e) {
        var root = document.getElementById('root');
        if (root && (!root.innerHTML || root.innerHTML.trim() === '')) {
          root.innerHTML = '<div style="padding:24px;font-family:sans-serif;background:#0b0a12;color:#f1effa;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;">' +
            '<h2 style="color:#ff6b6b;margin-bottom:12px;">App Failed to Start</h2>' +
            '<p style="max-width:400px;font-size:14px;color:rgba(255,255,255,0.7);">' + (e.message || 'JavaScript error occurred on load') + '</p>' +
            '<p style="font-size:11px;color:rgba(255,255,255,0.4);word-break:break-all;margin-top:8px;">' + (e.filename || '') + ':' + (e.lineno || '') + '</p>' +
            '<button onclick="window.location.reload()" style="margin-top:16px;padding:8px 18px;border-radius:8px;border:none;background:#287ce0;color:#fff;font-weight:600;">Reload</button>' +
            '</div>';
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Disable service worker in native Capacitor apps to avoid WebView caching collisions
      const isNativeApp = window.Capacitor !== undefined || 
                          window.location.protocol === 'capacitor:' || 
                          navigator.userAgent.includes('wv') ||
                          navigator.userAgent.includes('Capacitor');

      if (!isNativeApp && 'serviceWorker' in navigator) {
        const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        let refreshing = false;

        if (!isLocal) {
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });
        }

        window.addEventListener('load', () => {
          if (isLocal) {
            navigator.serviceWorker.getRegistrations().then((registrations) => {
              for (const registration of registrations) {
                registration.unregister();
              }
            }).catch(() => {});
          } else {
            navigator.serviceWorker.register('/sw.js?v=17.0').then((reg) => {
              reg.update();
            }).catch(() => {});
          }
        });
      }
    </script>
  </body>
</html>
